name: R-CMD-check-BLIS

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  R-CMD-check:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install BLIS system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libblis-dev
          sudo update-alternatives --display libblas.so.3-x86_64-linux-gnu
          ls -l /usr/lib/x86_64-linux-gnu/blis-openmp/

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Force R to use BLIS
        run: |
          R_HOME="$(R RHOME)"
          # Redirect the default R BLAS pointer to the installed BLIS library
          sudo ln -sf /usr/lib/x86_64-linux-gnu/blis-openmp/libblas.so "$R_HOME/lib/libRblas.so"
          # Print R's session details to verify the BLAS choice visually in the logs
          Rscript -e "sessionInfo()"

      - name: Set up R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - name: Check R Package
        uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"warning"'
          upload-snapshots: true
