# MKL-only adaptation of https://github.com/r-hub/actions/blob/v1/workflows/rhub.yaml
# Uses R-hub's platform configuration, container, dependencies, and check action.
name: R-CMD-check-MKL

on:
  push:
    branches: [main, master, unit-tests]
  pull_request:
    branches: [main, master]

jobs:
  check:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/r-hub/containers/mkl:latest

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        R -q -e 'pak::pkg_install(c("deps::.", "any::rcmdcheck"), dependencies = TRUE)'

    - uses: r-lib/actions/check-r-package@v2
